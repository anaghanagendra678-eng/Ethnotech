<!DOCTYPE html>
<html>
<head>
<style>
.static {
  position: static;
  background: gray;
}

.box {
  width: 120px;
  height: 80px;
  color: white;
  padding: 10px;
}

.container {
  position: relative;
  height: 200px;
  border: 2px solid black;
}

/* Relative position */
.relative {
  position: relative;
  top: 20px;
  left: 30px;
  background-color: blue;
}

/* Absolute position */
.absolute {
  position: absolute;
  top: 150px;
  left: 50px;
  background-color: green;
}

/* Fixed position */
.fixed {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background-color: red;
}

/* Sticky position */
.sticky {
  position: sticky;
  top: 0;
  background-color: purple;
}

</style>
</head>

<body>


<div class="box sticky">Sticky Box</div>

<div class="box relative">Relative Box</div>

<div class="box absolute">Absolute Box</div>
<br> <br> <br>
<div class="box fixed">Fixed Box</div>

<div class="box static">Static</div>
<br>
<div class="container">
  This is a container div
</div>
<p style="margin-top:800px;">Scroll down to see sticky and fixed effect</p>

</body>
</html>
